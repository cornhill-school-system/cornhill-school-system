<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORNHILL NURSERY AND PRIMARY SCHOOL | Management System</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f4f6fa;--navy:#172b4d;--blue:#2459a9;--line:#dfe5ee;--muted:#65738b}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:600}button.secondary{background:#e9eef7;color:#1e355b}button.danger{background:#a52828}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{background:#fff;padding:30px;border-radius:16px;box-shadow:0 12px 40px #15274412;width:min(420px,100%)}h1,h2,h3,p{margin-top:0}h1{font-size:24px}.muted{color:var(--muted)}label{display:block;font-size:13px;color:#4d5a70;margin:12px 0 5px}input,select{width:100%;padding:11px;border:1px solid #ccd5e3;border-radius:8px;background:#fff;color:#172033}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.sidebar{background:var(--navy);color:#fff;padding:22px 14px}.brand{font-weight:800;font-size:17px;padding:0 10px 24px;line-height:1.4}.navbtn{display:block;width:100%;text-align:left;background:transparent;color:#dce6f5;margin:4px 0;font-weight:500}.navbtn.active,.navbtn:hover{background:#ffffff1b;color:#fff}.side-foot{margin:28px 10px 0;color:#b6c5dc;font-size:12px}.main{min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar h2{margin:0;font-size:20px}.content{padding:24px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.stat .value{font-size:25px;font-weight:800;margin:9px 0}.stat .label{font-size:13px;color:var(--muted)}.panel{margin-bottom:18px}.panel h3{font-size:16px;margin-bottom:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.formgrid label{margin-top:0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #edf0f5}th{background:#f7f9fc;color:#5d6b80;font-weight:700}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{padding:12px;border-radius:8px;background:#eef5ff;color:#234c85;margin-bottom:14px;font-size:13px}.error{background:#fff0f0;color:#9d2424}.success{background:#eaf8ef;color:#216b3a}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.toolbar input{max-width:320px}.small{font-size:12px}.print-only{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px;display:flex;flex-wrap:wrap;gap:4px}.brand{width:100%;padding:5px 8px 12px}.navbtn{width:auto;margin:0;padding:9px 10px}.side-foot{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:15px}.topbar{padding:15px}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.cards,.grid2,.formgrid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.navbtn{font-size:12px;padding:8px}}
@media print{.sidebar,.topbar,.no-print,button{display:none!important}.report-card{border:0!important;padding:0!important;max-width:none!important}.report-card .cards{grid-template-columns:repeat(4,minmax(0,1fr))}.app{display:block}.content{padding:0}.panel,.stat{border:0}.print-only{display:block}body{background:#fff}}
</style>
</head>
<body>
<div id="login" class="login-wrap">
  <form id="loginForm" class="login-card">
    <h1 style="font-size:20px">🏫 CORNHILL NURSERY AND PRIMARY SCHOOL</h1>
    <p class="muted">Primary school administration · UGX</p>
    <div id="loginMsg" class="notice hidden"></div>
    <label>Username</label><input id="username" autocomplete="username" required>
    <label>Password</label><input id="password" type="password" autocomplete="current-password" required>
    <button style="width:100%;margin-top:18px">Sign in</button>
    <p class="muted small" style="margin:16px 0 0">Use the administrator account created during setup.</p>
  </form>
</div>
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">🏫 <span id="schoolName">CORNHILL NURSERY AND PRIMARY SCHOOL</span><div class="small" style="font-weight:400;color:#b6c5dc">Management System</div></div>
    <button class="navbtn active" data-page="dashboard">▦ Dashboard</button>
    <button class="navbtn" data-page="students">♙ Students</button>
    <button class="navbtn" data-page="payments">▤ Fees & Receipts</button>
    <button class="navbtn" data-page="attendance">✓ Attendance</button>
    <button class="navbtn" data-page="academic">✦ Academic</button>
    <button class="navbtn" data-page="inventory">▣ Inventory</button>
    <button class="navbtn" data-page="staff">♧ Staff</button>
    <button class="navbtn" data-page="expenses">↗ Expenses</button>
    <button class="navbtn" data-page="reports">▤ Reports</button>
    <button class="navbtn admin-only" data-page="users">⚙ User Accounts</button>
    <div class="side-foot">Foundation version 0.1<br>Store data securely and back up regularly.</div>
  </aside>
  <main class="main">
    <header class="topbar"><h2 id="pageTitle">Dashboard</h2><div class="actions"><span id="who" class="muted small"></span><button class="secondary" id="logout">Sign out</button></div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem("school_token")||"", me=null, studentsCache=[], itemsCache=[];
const money=n=>"UGX "+Number(n||0).toLocaleString("en-UG");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opts={}){const r=await fetch("/api"+url,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opts.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||"Request failed");return data}
function msg(text,kind="notice"){return `<div class="${kind} notice">${esc(text)}</div>`}
function field(label,name,placeholder="",type="text",required=true){return `<div><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${required?"required":""}></div>`}
function selectField(label,name,options,required=true){return `<div><label>${label}</label><select name="${name}" ${required?"required":""}>${options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select></div>`}
function formPanel(title,id,fields,button="Save"){return `<section class="panel"><h3>${title}</h3><form id="${id}"><div class="formgrid">${fields}</div><div style="margin-top:14px"><button>${button}</button></div><div id="${id}Msg"></div></form></section>`}
function photoField(label="Photo"){return `<div><label>${label} (optional)</label><input name="photo_file" type="file" accept="image/jpeg,image/png,image/webp"></div>`}
function readPhoto(file){return new Promise((resolve,reject)=>{if(!file){resolve("");return}if(!file.type.startsWith("image/")){reject(Error("Choose an image file."));return}const reader=new FileReader();reader.onerror=()=>reject(Error("Could not read the photo."));reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,700/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",0.78))};img.onerror=()=>reject(Error("Could not process the photo."));img.src=reader.result};reader.readAsDataURL(file)})}
function portrait(src,name){return src?`<img src="${src}" alt="${esc(name)} photo" style="width:48px;height:48px;object-fit:cover;border-radius:50%;border:1px solid #dfe5ee">`:`<div style="width:48px;height:48px;border-radius:50%;background:#e9eef7;display:grid;place-items:center;color:#2459a9;font-weight:700">${esc(String(name||"?").trim().charAt(0).toUpperCase())}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="muted">No records yet.</td></tr>`}</tbody></table></div>`}
function setPage(page){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("pageTitle").textContent=({dashboard:"Dashboard",students:"Students",payments:"Fees & Receipts",attendance:"Attendance",academic:"Academic Records",inventory:"Inventory",staff:"Staff",expenses:"Expenses",reports:"Reports",users:"User Accounts"})[page]||page;render(page).catch(e=>{$("content").innerHTML=msg(e.message,"error")})}
async function start(){try{const x=await api("/me");me=x.user;$("schoolName").textContent=x.school;$("who").textContent=me.full_name+" · "+me.role;$("login").classList.add("hidden");$("app").classList.remove("hidden");document.querySelectorAll(".admin-only").forEach(e=>e.classList.toggle("hidden",me.role!=="admin"));setPage("dashboard")}catch{$("login").classList.remove("hidden");$("app").classList.add("hidden")}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").classList.add("hidden");try{const x=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})}).then(r=>r.json().then(d=>{if(!r.ok)throw Error(d.error);return d}));token=x.token;localStorage.setItem("school_token",token);start()}catch(err){$("loginMsg").textContent=err.message;$("loginMsg").className="notice error"}});
$("logout").onclick=()=>{token="";me=null;localStorage.removeItem("school_token");$("app").classList.add("hidden");$("login").classList.remove("hidden");$("password").value=""};
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
async function render(page){const c=$("content");c.innerHTML="<p class='muted'>Loading…</p>";
if(page==="dashboard"){const d=await api("/dashboard");c.innerHTML=`<div class="cards">${[["Active students",d.students],["Active staff",d.staff],["Present today",d.presentToday],["Low-stock items",d.lowStock],["Fees collected today",money(d.feesCollectedToday)],["Expenses today",money(d.expensesToday)]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join("")}</div><section class="panel"><h3>Welcome, ${esc(me.full_name)}</h3><p class="muted">Use the menu to manage school records. Amounts are in Ugandan shillings (UGX).</p><div class="actions no-print"><button onclick="setPage('students')">Register student</button><button onclick="setPage('payments')">Record fee payment</button><button onclick="setPage('inventory')">Manage inventory</button><button class="secondary" onclick="window.print()">Print dashboard</button></div></section><div class="notice">This is the initial foundation. Reconcile financial records and test backup/restore before using it for live school operations.</div>`;return}
if(page==="students"){studentsCache=await api("/students");const classes=["Baby","Middle","Top","P.1","P.2","P.3","P.4","P.5","P.6","P.7"];const clsOpts=[["","Select class"],...classes.map(x=>[x,x])];const boardOpts=[["day","Day scholar"],["boarding","Boarding"]];const mealFields=selectField("Attendance type","boarding_status",boardOpts)+selectField("Breakfast","takes_breakfast",[["0","No"],["1","Yes"]])+selectField("Lunch","takes_lunch",[["0","No"],["1","Yes"]])+field("House / dormitory","house_or_dormitory","Optional","text",false);c.innerHTML=`${me.role==="admin"||me.role==="headteacher"?formPanel("Register new learner","studentForm",field("Admission number","admission_no","e.g. PS-001")+field("First name","first_name")+field("Last name","last_name")+selectField("Gender","gender",[["","Select"],["Female","Female"],["Male","Male"]],false)+selectField("Class","class_name",clsOpts)+field("Date of birth","date_of_birth","", "date",false)+field("Guardian name","guardian_name","", "text",false)+field("Guardian phone","guardian_phone","", "tel",false)+mealFields+selectField("Bursary","bursary_status",[["none","No bursary"],["full","Full bursary"],["partial","Partial bursary"]])+field("Bursary amount (UGX)","bursary_amount_ugx","0","number",false)+photoField("Learner photo")):""}<section class="panel"><div class="toolbar"><h3>Class register</h3><select id="classFilter"><option value="">All classes</option>${classes.map(x=>`<option value="${x}">${x}</option>`).join("")}</select><input id="studentSearch" placeholder="Search learner…"><button class="secondary no-print" onclick="window.print()">Print register</button></div><div class="cards" id="classStats"></div><div id="studentTable">${studentTable(studentsCache)}</div></section><section class="panel"><h3>Learners on bursary</h3><div id="bursaryTable"></div></section>`;bindForm("studentForm","/students",()=>setPage("students"));const update=()=>{const cl=$("classFilter").value,q=$("studentSearch").value.toLowerCase();const rows=studentsCache.filter(s=>(!cl||s.class_name===cl)&&JSON.stringify(s).toLowerCase().includes(q));$("studentTable").innerHTML=studentTable(rows);$("classStats").innerHTML=[["Learners",rows.length],["Boarders",rows.filter(s=>s.boarding_status==="boarding").length],["Breakfast",rows.filter(s=>Number(s.takes_breakfast)===1).length],["Lunch",rows.filter(s=>Number(s.takes_lunch)===1).length]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join("")};$("studentSearch").addEventListener("input",update);$("classFilter").addEventListener("change",update);update();const bursaryRows=studentsCache.filter(s=>s.bursary_status&&s.bursary_status!=="none");$("bursaryTable").innerHTML=table(["Photo","Admission","Learner","Class","Bursary type","Amount (UGX)"],bursaryRows.map(s=>`<tr><td>${portrait(s.photo_data_url,s.first_name+" "+s.last_name)}</td><td>${esc(s.admission_no)}</td><td>${esc(s.first_name+" "+s.last_name)}</td><td>${esc(s.class_name)}</td><td>${esc(s.bursary_status)}</td><td>${money(s.bursary_amount_ugx)}</td></tr>`).join(""));return}
if(page==="payments"){studentsCache=await api("/students");const studentOpts=[["","Choose student"],...studentsCache.map(s=>[s.id,`${s.admission_no} · ${s.first_name} ${s.last_name} (${s.class_name})`])];c.innerHTML=`${["admin","bursar"].includes(me.role)?formPanel("Record fee payment","paymentForm",selectField("Student","student_id",studentOpts)+field("Amount (UGX)","amount_ugx","e.g. 150000","number")+selectField("Payment method","payment_method",[["cash","Cash"],["mobile_money","Mobile money"],["bank","Bank"],["cheque","Cheque"]])+selectField("Term","term",[["Term 1","Term 1"],["Term 2","Term 2"],["Term 3","Term 3"]])+field("Academic year","academic_year",String(new Date().getFullYear()),"number")+field("Transaction reference","reference","Optional", "text",false)):""}<section class="panel"><div class="toolbar"><h3>Payment records</h3><button class="secondary no-print" onclick="window.print()">Print list</button></div><div id="paymentTable"></div></section>`;bindForm("paymentForm","/payments",async p=>{await setPage("payments")},true);const ps=await api("/payments");$("paymentTable").innerHTML=table(["Receipt","Date","Student","Class","Amount","Method","Term"],ps.map(p=>`<tr><td>${esc(p.receipt_no)}</td><td>${esc(p.created_at)}</td><td>${esc(p.first_name+" "+p.last_name)}</td><td>${esc(p.class_name)}</td><td>${money(p.amount_ugx)}</td><td>${esc(p.payment_method)}</td><td>${esc(p.term)} ${esc(p.academic_year)}</td></tr>`).join(""));return}
if(page==="academic"){
 const classes=["Baby","Middle","Top","P.1","P.2","P.3","P.4","P.5","P.6","P.7"], terms=["Term 1","Term 2","Term 3"], periods=["Beginning of Term","Mid-Term","End of Term"];
 const yearNow=new Date().getFullYear();
 c.innerHTML=`<section class="panel" style="background:linear-gradient(120deg,#172b4d,#2459a9);color:white;border:0"><h3 style="font-size:22px;margin-bottom:6px;color:white">Academic Centre</h3><p style="margin:0;color:#e1eafa">Manage subject names, enter marks in three assessment periods, and review class performance.</p></section>
 <section class="panel"><h3>Choose assessment</h3><div class="formgrid"><div><label>Class</label><select id="acClass">${classes.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Academic year</label><input id="acYear" type="number" min="2000" max="2100" value="${yearNow}"></div><div><label>Term</label><select id="acTerm">${terms.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Assessment period</label><select id="acPeriod">${periods.map(x=>`<option>${x}</option>`).join("")}</select></div></div><div class="actions" style="margin-top:14px"><button id="acLoad">Load mark sheet</button><button class="secondary" id="acSetup">Edit subject headings</button><button class="secondary" id="acAnalysis">View class analysis</button><button class="secondary" id="acReport">Generate report card</button><button class="secondary" id="acGrading">Grading scale</button><button class="secondary" id="acRanking">Class ranking</button><button class="secondary" id="acYearSummary">Year summary & promotion review</button></div><div id="acMsg" style="margin-top:10px"></div></section>
 <section class="panel" id="acSubjectPanel" style="display:none"><h3>Edit subject headings</h3><p class="muted small">Enter one subject per line. Saving changes the active headings for this class; previously saved marks are retained under their original subject names.</p><label>Subjects (one per line)</label><textarea id="acSubjects" rows="8" style="width:100%;padding:12px;border:1px solid #ccd5e3;border-radius:8px"></textarea><div class="actions" style="margin-top:10px"><button id="acSaveSubjects">Save subject headings</button><button class="secondary" id="acCancelSubjects">Cancel</button></div></section>
 <section class="panel"><div class="toolbar"><div><h3 style="margin-bottom:4px">Marks register</h3><div id="acSubtitle" class="muted small">Load a mark sheet to begin.</div></div><button class="secondary no-print" id="acPrint">Print</button></div><div id="acMarks"></div><div class="actions no-print" style="margin-top:14px"><button id="acSaveMarks">Save marks</button></div></section><section class="panel" id="acAnalysisPanel" style="display:none"><div class="toolbar"><h3>Class performance analysis</h3><button class="secondary" id="acHideAnalysis">Close analysis</button></div><div id="acAnalysisContent"></div></section><section class="panel" id="acGradingPanel" style="display:none"><div class="toolbar"><h3>School grading scale</h3><button class="secondary" id="acHideGrading">Close</button></div><p class="muted small">Enter the grading boundaries approved by your school. Ranges must not overlap. Leave this unconfigured until you know the official rules.</p><div id="acGradeRows"></div><div class="actions"><button class="secondary" id="acAddGrade">Add grade row</button><button id="acSaveGrading">Save grading scale</button></div></section><section class="panel" id="acRankingPanel" style="display:none"><div class="toolbar"><h3>Class ranking and term summary</h3><button class="secondary" id="acHideRanking">Close</button></div><p class="muted small">Ranking uses the average of all marks entered for the selected term across the three assessment periods. Learners with no marks are listed last and are not ranked.</p><div id="acRankingContent"></div><button class="secondary no-print" id="acPrintRanking">Print ranking</button></section><section class="panel" id="acYearSummaryPanel" style="display:none"><div class="toolbar"><h3>Annual performance & promotion review</h3><button class="secondary" id="acHideYearSummary">Close</button></div><p class="muted small">Annual averages are calculated from available marks in each term, then averaging the available term averages. This is a review aid only; it does not automatically promote learners or decide pass/fail.</p><div id="acYearSummaryContent"></div><button class="secondary no-print" id="acPrintYearSummary">Print annual summary</button></section><section class="panel" id="acReportPanel" style="display:none"><div class="toolbar no-print"><h3>Individual report card</h3><button class="secondary" id="acHideReport">Close</button></div><div class="formgrid no-print" style="margin-bottom:14px"><div><label>Learner</label><select id="acReportStudent"></select></div><div><label>Attendance from</label><input id="acAttendanceFrom" type="date"></div><div><label>Attendance to</label><input id="acAttendanceTo" type="date"></div><div style="align-self:end"><button id="acLoadReport">Load report card</button></div><div style="align-self:end"><button class="secondary" id="acPrintReport">Print report card</button></div></div><section class="panel no-print"><h3>Smart report comment assistant</h3><p class="muted small">Creates editable suggestions from this learner's actual marks, subject strengths, improvement across the three assessments, and attendance when supplied. Always review the wording before saving.</p><div class="formgrid"><div><label>Comment style</label><select id="acCommentStyle"><option value="encouraging">Encouraging and supportive</option><option value="formal">Formal school report</option><option value="concise">Short and direct</option></select></div><div style="align-self:end"><button type="button" id="acGenerateComments">Generate comments from performance</button></div><div><label>Comment library</label><select id="acCommentPreset"><option value="">Choose a school comment template…</option><option value="positive">Positive performance</option><option value="improvement">Improvement needed</option><option value="effort">Effort and participation</option><option value="behaviour">Conduct and cooperation</option><option value="attendance">Attendance and punctuality</option><option value="parent">Parent/guardian support</option></select></div><div style="align-self:end"><button type="button" class="secondary" id="acApplyPreset">Use selected template</button></div><div><label>Class teacher's comment</label><textarea id="acTeacherComment" rows="4" maxlength="1000" style="width:100%" placeholder="Generated suggestion will appear here; you can edit it."></textarea></div><div><label>Headteacher's remark</label><textarea id="acHeadComment" rows="4" maxlength="1000" style="width:100%" placeholder="Generated suggestion will appear here; you can edit it."></textarea></div></div><div class="actions"><button id="acSaveReportNotes">Save comments</button></div><p class="muted small">Generated comments are suggestions, not automatic judgements. Attendance is used only when both dates are selected. Choose the actual term dates used by your school.</p></section><div id="acReportContent"></div></section>`;
 let subjects=[], markRows=[];
 const cfg=()=>({class_name:$('acClass').value,academic_year:Number($('acYear').value),term:$('acTerm').value,assessment_period:$('acPeriod').value});
 const notice=(t,k='notice')=>{$('acMsg').innerHTML=msg(t,k)};
 const loadSubjects=async()=>{subjects=await api('/academic/subjects?class_name='+encodeURIComponent($('acClass').value));};
 const renderMarks=()=>{if(!subjects.length){$('acMarks').innerHTML=msg('No subject headings are set for this class. Choose “Edit subject headings” to add them.');return}const learners=new Map();for(const r of markRows){if(!learners.has(r.student_id))learners.set(r.student_id,{...r,marks:{}});if(r.subject_name)learners.get(r.student_id).marks[r.subject_name]=r.mark}

 $('acMarks').innerHTML=table(['Admission number','Learner',...subjects,'Total','Average'],rows.map(st=>{const vals=subjects.map(sub=>st.marks[sub]??'');const nums=vals.filter(v=>v!==''&&v!==null&&v!==undefined).map(Number);return `<tr><td>${esc(st.admission_no)}</td><td>${esc(st.name||st.first_name+' '+st.last_name)}</td>${subjects.map((sub,i)=>`<td><input aria-label="${esc(sub)} for ${esc(st.name||st.admission_no)}" type="number" min="0" max="100" step="0.5" data-student="${st.student_id}" data-subject="${esc(sub)}" value="${vals[i]??''}" style="min-width:76px;padding:8px" /></td>`).join('')}<td data-total="${st.student_id}">${nums.length?nums.reduce((a,b)=>a+b,0).toFixed(1):'—'}</td><td data-average="${st.student_id}">${nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1):'—'}</td></tr>`}).join(''));

 let loadedReport=null;const loadReportCard=async()=>{const studentId=$('acReportStudent').value;if(!studentId)throw Error('Choose a learner first.');const q=new URLSearchParams({student_id:studentId,academic_year:$('acYear').value,term:$('acTerm').value});if($('acAttendanceFrom').value&&$('acAttendanceTo').value){q.set('date_from',$('acAttendanceFrom').value);q.set('date_to',$('acAttendanceTo').value)}const r=await api('/academic/report-card?'+q);loadedReport=r;$('acTeacherComment').value=r.notes?.class_teacher_comment||'';$('acHeadComment').value=r.notes?.headteacher_comment||'';$('acReportContent').innerHTML=`<div class="report-card" style="max-width:900px;margin:auto;border:2px solid #2459a9;border-radius:12px;padding:22px"><div style="text-align:center;border-bottom:2px solid #2459a9;padding-bottom:12px;margin-bottom:16px"><h2 style="margin:0;color:#172b4d">${esc($('schoolName').textContent||'Primary School')}</h2><div style="font-weight:700;margin-top:5px">LEARNER ACADEMIC REPORT</div><div>${esc(r.term)} · ${esc(r.academic_year)}</div></div><div class="formgrid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px"><div><strong>Learner:</strong> ${esc(r.learner.first_name+' '+r.learner.last_name)}</div><div><strong>Admission No:</strong> ${esc(r.learner.admission_no)}</div><div><strong>Class:</strong> ${esc(r.learner.class_name)}</div><div><strong>Gender:</strong> ${esc(r.learner.gender||'—')}</div></div>${table(['Subject',...r.assessment_periods,'Average','Grade','Remark'],r.subjects.map(x=>`<tr><td>${esc(x.subject)}</td>${r.assessment_periods.map(p=>`<td>${x.marks[p]===null||x.marks[p]===undefined?'—':Number(x.marks[p]).toFixed(1)}</td>`).join('')}<td>${x.average===null?'—':x.average.toFixed(1)}</td><td>${esc(x.grade||'—')}</td><td>${esc(x.remark||'')}</td></tr>`).join(''))}<div class="cards" style="margin-top:16px"><div class="stat"><div class="label">Subjects with marks</div><div class="value">${r.summary.subjects_with_marks}/${r.summary.total_subjects}</div></div><div class="stat"><div class="label">Overall average</div><div class="value">${r.summary.overall_average===null?'—':r.summary.overall_average.toFixed(1)}</div></div><div class="stat"><div class="label">Overall grade</div><div class="value">${esc(r.summary.overall_grade||'—')}</div></div><div class="stat"><div class="label">Grading setup</div><div class="value" style="font-size:15px">${r.grading_configured?'Configured':'Pending'}</div></div></div>${!r.grading_configured?'<p class="notice">Official grades and remarks are not shown because the school grading scale has not yet been configured.</p>':''}<h3 style="margin-top:18px">Attendance summary</h3>${r.attendance.date_from&&r.attendance.date_to?`<p class="muted small">${esc(r.attendance.date_from)} to ${esc(r.attendance.date_to)}</p><div class="cards">${[['Present',r.attendance.present],['Absent',r.attendance.absent],['Late',r.attendance.late],['Excused',r.attendance.excused],['Recorded days',r.attendance.total]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div>`:'<p>Attendance dates were not selected.</p>'}<h3 style="margin-top:18px">Class teacher's comment</h3><p style="white-space:pre-wrap">${esc(r.notes?.class_teacher_comment||'—')}</p><h3>Headteacher's remark</h3><p style="white-space:pre-wrap">${esc(r.notes?.headteacher_comment||'—')}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:35px"><div style="border-top:1px solid #667085;padding-top:7px">Class teacher signature</div><div style="border-top:1px solid #667085;padding-top:7px">Headteacher signature</div></div></div>`};

 const makePerformanceComments=(r,style)=>{
   const avg=r.summary?.overall_average;
   const graded=(r.subjects||[]).filter(x=>x.average!==null&&x.average!==undefined);
   if(!graded.length) return {teacher:'Marks are not yet available for a meaningful performance comment. Please complete and verify the learner’s assessments before finalising this report.',head:'Please ensure the learner’s assessment records are completed and reviewed before the report is finalised.'};
   const sorted=[...graded].sort((a,b)=>b.average-a.average), strongest=sorted.slice(0,Math.min(2,sorted.length)).map(x=>x.subject), needs=[...sorted].reverse().slice(0,Math.min(2,sorted.length)).map(x=>x.subject);
   const label=avg>=80?'very strong':avg>=65?'good':avg>=50?'developing':avg>=35?'needs further support':'requires focused support';
   const start=r.subjects.map(x=>x.marks?.['Beginning of Term']).filter(v=>v!==null&&v!==undefined&&v!=='').map(Number);
   const mid=r.subjects.map(x=>x.marks?.['Mid-Term']).filter(v=>v!==null&&v!==undefined&&v!=='').map(Number);
   const end=r.subjects.map(x=>x.marks?.['End of Term']).filter(v=>v!==null&&v!==undefined&&v!=='').map(Number);
   const mean=a=>a.length?a.reduce((n,v)=>n+v,0)/a.length:null, a=mean(start), b=mean(mid), c=mean(end);
   let progress=''; if(a!==null&&c!==null){const d=c-a;progress=d>=5?'The marks show improvement from the beginning to the end of term.':d<=-5?'The marks suggest that performance has fallen since the beginning of term and should be reviewed with supportive follow-up.':'Performance has remained broadly steady between the beginning and end of term.'} else if(b!==null&&c!==null){const d=c-b;progress=d>=5?'The available marks show improvement between mid-term and end of term.':d<=-5?'The available marks show a decline from mid-term to end of term; extra guidance may help.':'The available mid-term and end-of-term marks are broadly steady.'}
   const top=strongest.length?`Relative strengths are shown in ${strongest.join(' and ')}.`:'';
   const focus=needs.length?`Further practice and teacher guidance in ${needs.join(' and ')} may help strengthen understanding.`:'';
   let attendance=''; const at=r.attendance; if(at&&at.total>0){const rate=Math.round((Number(at.present||0)+Number(at.late||0))/at.total*100);attendance=rate<80?'Attendance records indicate frequent missed or late sessions; please work with the school to support regular attendance.':rate>=95?'Attendance has been very regular during the selected period.':'Regular attendance will help the learner maintain progress.'}
   let teacher;
   if(style==='concise') teacher=`Overall performance is ${label} (average ${avg}%). ${top} ${focus} ${progress}`;
   else if(style==='formal') teacher=`The learner has recorded ${label} performance, with an overall average of ${avg}%. ${top} ${progress} ${focus} Continued practice, participation and completion of assigned work are encouraged.`;
   else teacher=`The learner is making progress, with ${label} overall performance and an average of ${avg}%. ${top} ${progress} ${focus} With consistent effort, regular practice and support at school and at home, the learner can continue to develop.`;
   if(attendance) teacher+=' '+attendance;
   let head;
   if(avg>=80) head=style==='concise'?'A strong result. Keep up the effort and continue to aim high.':'The learner has performed well this term. The school encourages continued commitment, good study habits and steady progress.';
   else if(avg>=60) head=style==='concise'?'Good progress; continued effort is encouraged.':'The learner has made satisfactory progress. Continued practice and cooperation between home and school will help strengthen achievement.';
   else if(avg>=40) head=style==='concise'?'More consistent practice and support are recommended.':'The learner is developing academically and would benefit from a structured revision routine, regular completion of tasks and targeted support in the areas identified.';
   else head=style==='concise'?'Please arrange focused support and monitor progress.':'The learner needs additional academic support. The school recommends close follow-up, regular practice and collaboration with the parent or guardian to agree on helpful next steps.';
   if(attendance) head+=' '+(at.total>0&&((Number(at.present||0)+Number(at.late||0))/at.total)<.8?'Regular attendance should also be prioritised.':'Regular attendance and communication with the school remain important.');
   teacher=teacher.replace(/\s+/g,' ').trim();head=head.replace(/\s+/g,' ').trim();
   return {teacher:teacher.slice(0,1000),head:head.slice(0,1000)};
 };

if(page==="staff"){const ss=await api("/staff");const year= new Date().getFullYear();c.innerHTML=`${["admin","headteacher"].includes(me.role)?formPanel("Add staff member","staffForm",field("Staff number","staff_no","e.g. ST-001")+field("Full name","full_name")+selectField("Staff category","staff_type",[["teaching","Teaching staff"],["non_teaching","Non-teaching staff"]])+field("Job title","role_title","Teacher, bursar…")+field("Monthly salary (UGX)","monthly_salary_ugx","e.g. 500000","number")+field("Usual payment day (1–31)","payment_day","e.g. 30","number")+field("Phone","phone","", "tel",false)+field("Email","email","", "email",false)+photoField("Staff photo")):""}<section class="panel"><div class="toolbar"><h3>Whole staff register (${ss.length})</h3><button class="secondary no-print" onclick="window.print()">Print staff list</button></div><div class="cards">${[["All staff",ss.length],["Teaching staff",ss.filter(x=>x.staff_type!=="non_teaching").length],["Non-teaching staff",ss.filter(x=>x.staff_type==="non_teaching").length],["Monthly salary total",money(ss.reduce((n,x)=>n+Number(x.monthly_salary_ugx||0),0))]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join("")}</div><h3>Teaching staff</h3><div>${staffTable(ss.filter(x=>x.staff_type!=="non_teaching"))}</div><h3 style="margin-top:22px">Non-teaching staff</h3><div>${staffTable(ss.filter(x=>x.staff_type==="non_teaching"))}</div></section><section class="panel ${["admin","headteacher"].includes(me.role)?"":"hidden"}"><h3>Three-month salary and payment balance</h3><p class="muted small">For each term, salary due is monthly salary × 3. Record each month's payment below; entering a payment for the same staff member, term, year and month updates that month's record.</p><div class="formgrid"><div><label>Academic year</label><input id="payYear" type="number" value="${year}"></div><div><label>Term</label><select id="payTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div><div style="align-self:end"><button type="button" id="loadPayroll">Load salary balances</button></div></div><div id="payrollTable" style="margin-top:14px"></div></section>${["admin","headteacher"].includes(me.role)?formPanel("Record monthly salary payment","payrollForm",selectField("Staff member","staff_id",[["","Choose staff"],...ss.map(x=>[x.id,`${x.staff_no} · ${x.full_name}`])])+field("Academic year","academic_year",String(year),"number")+selectField("Term","term",[["Term 1","Term 1"],["Term 2","Term 2"],["Term 3","Term 3"]])+selectField("Month in term","term_month",[["1","Month 1"],["2","Month 2"],["3","Month 3"]])+field("Amount paid (UGX)","amount_paid_ugx","Amount","number")+field("Date paid","paid_on",new Date().toISOString().slice(0,10),"date")+field("Reference / note","reference","Optional","text",false),"Save salary payment"):""}`;bindForm("staffForm","/staff",()=>setPage("staff"));bindForm("payrollForm","/payroll",async()=>{await loadPayroll()});const loadPayroll=async()=>{const rows=await api(`/payroll?academic_year=${encodeURIComponent($("payYear").value)}&term=${encodeURIComponent($("payTerm").value)}`);const section=(title,arr)=>`<h3 style="margin-top:18px">${title}</h3>${table(["Photo","Staff","Monthly salary","Pay day","Month 1 paid","Month 2 paid","Month 3 paid","Term due","Term paid","Balance"],arr.map(x=>`<tr><td>${portrait(x.photo_data_url,x.full_name)}</td><td>${esc(x.full_name)}<div class="muted small">${esc(x.staff_no)} · ${esc(x.role_title||"")}</div></td><td>${money(x.monthly_salary_ugx)}</td><td>${esc(x.payment_day)}</td>${x.months.map(m=>`<td>${m?`${money(m.amount_paid_ugx)}<div class="muted small">${esc(m.paid_on)}</div>`:"—"}</td>`).join("")}<td>${money(x.total_term_due_ugx)}</td><td>${money(x.total_paid_ugx)}</td><td><strong>${money(x.balance_ugx)}</strong></td></tr>`).join(""))}`;$ ("payrollTable").innerHTML=section("Teaching staff",rows.filter(x=>x.staff_type!=="non_teaching"))+section("Non-teaching staff",rows.filter(x=>x.staff_type==="non_teaching"));};$("loadPayroll").onclick=loadPayroll;if(["admin","headteacher"].includes(me.role))await loadPayroll();return}
if(page==="expenses"){c.innerHTML=`${["admin","bursar"].includes(me.role)?formPanel("Record expense","expenseForm",field("Date","expense_date",new Date().toISOString().slice(0,10),"date")+field("Category","category","Supplies, utilities…")+field("Description","description")+field("Amount (UGX)","amount_ugx","Amount","number")+selectField("Payment method","payment_method",[["cash","Cash"],["mobile_money","Mobile money"],["bank","Bank"],["cheque","Cheque"]])+field("Reference","reference","Optional","text",false)):""}<section class="panel"><div class="toolbar"><h3>Expense register</h3><button class="secondary no-print" onclick="window.print()">Print expenses</button></div><div id="expenseTable"></div></section>`;bindForm("expenseForm","/expenses",()=>setPage("expenses"));const es=await api("/expenses");$("expenseTable").innerHTML=table(["Expense no.","Date","Category","Description","Amount","Method","Reference"],es.map(x=>`<tr><td>${esc(x.expense_no)}</td><td>${esc(x.expense_date)}</td><td>${esc(x.category)}</td><td>${esc(x.description)}</td><td>${money(x.amount_ugx)}</td><td>${esc(x.payment_method)}</td><td>${esc(x.reference)}</td></tr>`).join(""));return}
if(page==="reports"){const f=await api("/reports/finance"),low=await api("/reports/low-stock");c.innerHTML=`<section class="panel"><div class="toolbar"><h3>Financial summary</h3><button class="secondary no-print" onclick="window.print()">Print report</button></div><div class="cards"><div class="stat"><div class="label">Fees collected (all time)</div><div class="value">${money(f.totalFeesCollectedUGX)}</div></div><div class="stat"><div class="label">Expenses recorded (all time)</div><div class="value">${money(f.totalExpensesUGX)}</div></div><div class="stat"><div class="label">Net cash movement</div><div class="value">${money(f.netCashMovementUGX)}</div></div></div><h3>Fee payments by method</h3>${table(["Payment method","Total"],f.feePaymentsByMethod.map(x=>`<tr><td>${esc(x.payment_method)}</td><td>${money(x.total)}</td></tr>`).join(""))}</section><section class="panel"><h3>Low-stock report</h3>${table(["Item code","Item","Quantity","Unit","Reorder level","Location"],low.map(x=>`<tr><td>${esc(x.item_code)}</td><td>${esc(x.item_name)}</td><td>${esc(x.quantity)}</td><td>${esc(x.unit)}</td><td>${esc(x.reorder_level)}</td><td>${esc(x.location)}</td></tr>`).join(""))}</section><div class="notice">Foundation report only: this is a cash movement summary, not a complete audited income statement or double-entry trial balance.</div>`;return}
if(page==="users"){if(me.role!=="admin"){c.innerHTML=msg("Administrator access required.","error");return}const us=await api("/users");c.innerHTML=`${formPanel("Create staff login","userForm",field("Full name","full_name")+field("Username","username")+field("Temporary password (12+ characters)","password","Use a strong unique password","password")+selectField("Role","role",[["headteacher","Head teacher"],["bursar","Bursar"],["teacher","Teacher"],["storekeeper","Storekeeper"],["admin","Administrator"]]))}<section class="panel"><h3>Accounts</h3>${table(["Name","Username","Role","Active","Created"],us.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.active?"Yes":"No"}</td><td>${esc(u.created_at)}</td></tr>`).join(""))}</section>`;bindForm("userForm","/users",()=>setPage("users"));return}
}
function studentTable(rows){return table(["Photo","Admission","Student","Gender","Class","Day/Boarding","Breakfast","Lunch","Bursary","Bursary amount","House/Dorm","Guardian","Phone","Status"],rows.map(s=>`<tr><td>${portrait(s.photo_data_url,s.first_name+" "+s.last_name)}</td><td>${esc(s.admission_no)}</td><td>${esc(s.first_name+" "+s.last_name)}</td><td>${esc(s.gender)}</td><td>${esc(s.class_name)}</td><td>${s.boarding_status==="boarding"?"Boarding":"Day"}</td><td>${Number(s.takes_breakfast)===1?"Yes":"No"}</td><td>${Number(s.takes_lunch)===1?"Yes":"No"}</td><td>${s.bursary_status&&s.bursary_status!=="none"?esc(s.bursary_status):"No"}</td><td>${money(s.bursary_amount_ugx)}</td><td>${esc(s.house_or_dormitory||"")}</td><td>${esc(s.guardian_name)}</td><td>${esc(s.guardian_phone)}</td><td>${esc(s.status)}</td></tr>`).join(""))}
function staffTable(rows){return table(["Photo","Staff no.","Full name","Job title","Phone","Email","Monthly salary","Pay day","Status"],rows.map(s=>`<tr><td>${portrait(s.photo_data_url,s.full_name)}</td><td>${esc(s.staff_no)}</td><td>${esc(s.full_name)}</td><td>${esc(s.role_title)}</td><td>${esc(s.phone)}</td><td>${esc(s.email)}</td><td>${Number.isFinite(Number(s.monthly_salary_ugx))?money(s.monthly_salary_ugx):"Restricted"}</td><td>${s.payment_day??"Restricted"}</td><td>${esc(s.status)}</td></tr>`).join(""))}
function inventoryTable(rows){return table(["Code","Item","Category","Quantity","Unit","Reorder level","Unit cost","Location"],rows.map(i=>`<tr><td>${esc(i.item_code)}</td><td>${esc(i.item_name)}</td><td>${esc(i.category)}</td><td>${esc(i.quantity)}</td><td>${esc(i.unit)}</td><td>${esc(i.reorder_level)}</td><td>${money(i.unit_cost)}</td><td>${esc(i.location)}</td></tr>`).join(""))}
function bindForm(id,url,done){const f=$(id);if(!f)return;f.addEventListener("submit",async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f).entries());try{const photoInput=f.querySelector("input[name=photo_file]");if(photoInput&&photoInput.files&&photoInput.files[0])b.photo_data_url=await readPhoto(photoInput.files[0]);delete b.photo_file;if(url)await api(url,{method:"POST",body:JSON.stringify(b)});await done(b);if(url&&id!=="attendanceForm")f.reset();const m=$(id+"Msg");if(m)m.innerHTML=msg("Saved successfully.","success")}catch(err){const m=$(id+"Msg");if(m)m.innerHTML=msg(err.message,"error");else alert(err.message)}})}
start();
</script>
</body>
</html>
