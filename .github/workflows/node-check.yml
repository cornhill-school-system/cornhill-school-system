name: Node.js validation

on:
  push:
    branches:
      - postgres-migration-v0.6.8
  pull_request:
    branches:
      - postgres-migration-v0.6.8

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server and database scripts
        run: npm run check
